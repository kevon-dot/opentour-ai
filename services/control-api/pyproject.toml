[project]
name = "opentour-control"
version = "0.0.0"
requires-python = "==3.12.16"
dependencies = [
  "fastapi==0.163.0", "uvicorn==0.54.0", "pydantic==2.14.3",
  "workos==10.9.0", "PyJWT[crypto]==2.15.1", "cryptography==50.0.2",
  "psycopg[binary]==3.3.9",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opentour_control"]
