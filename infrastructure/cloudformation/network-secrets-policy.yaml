{
 "AWSTemplateFormatVersion": "2010-09-09",
 "Description": "OpenTour OPE-214 initial private browser identity REST gateway for Ohio dev",
 "Parameters": {
  "ExpectedProjectId": {
   "Type": "String",
   "Description": "Approved Ohio dev AWS project number",
   "AllowedPattern": "[0-9]{12}"
  },
  "BffRolePath": {
   "Type": "String",
   "Description": "Exact approved IAM role name and optional path for the dev BFF",
   "AllowedPattern": "[A-Za-z0-9+=,.@_/-]+"
  },
  "EndpointId": {
   "Type": "String",
   "Description": "Existing dedicated dev execute-api endpoint with no broad policy",
   "AllowedPattern": "vpce-[0-9a-f]+"
  },
  "VpcLinkV2Id": {
   "Type": "String",
   "Description": "Existing approved private VPC link V2 ID",
   "AllowedPattern": "[a-z0-9]+"
  },
  "BackendServerName": {
   "Type": "String",
   "Description": "Exact backend hostname covered by the private listener server certificate",
   "AllowedPattern": "(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\\.)+[a-z][a-z0-9-]*"
  },
  "NetworkLoadBalancerNameAndId": {
   "Type": "String",
   "Description": "Exact name and ID of the approved internal TCP NLB in this Ohio project",
   "AllowedPattern": "[A-Za-z0-9-]+/[0-9a-f]+"
  }
 },
 "Rules": {
  "ApprovedOhioProject": {
   "Assertions": [
    {
     "Assert": {
      "Fn::Equals": [
       {
        "Ref": "AWS::Region"
       },
       "us-east-2"
      ]
     },
     "AssertDescription": "This gateway is limited to Ohio"
    },
    {
     "Assert": {
      "Fn::Equals": [
       {
        "Ref": "AWS::AccountId"
       },
       {
        "Ref": "ExpectedProjectId"
       }
      ]
     },
     "AssertDescription": "Deploy only in the named dev project"
    }
   ]
  }
 },
 "Resources": {
  "PrivateApi": {
   "Type": "AWS::ApiGateway::RestApi",
   "Properties": {
    "Name": {
     "Fn::Sub": "${AWS::StackName}-identity"
    },
    "EndpointConfiguration": {
     "Types": [
      "PRIVATE"
     ],
     "IpAddressType": "dualstack",
     "VpcEndpointIds": [
      {
       "Ref": "EndpointId"
      }
     ]
    },
    "Policy": {
     "Version": "2012-10-17",
     "Statement": [
      {
       "Effect": "Deny",
       "Action": "execute-api:Invoke",
       "Principal": "*",
       "Resource": "execute-api:/*",
       "Condition": {
        "StringNotEquals": {
         "aws:SourceVpce": {
          "Ref": "EndpointId"
         }
        }
       }
      },
      {
       "Effect": "Deny",
       "Action": "execute-api:Invoke",
       "Principal": "*",
       "Resource": "execute-api:/*",
       "Condition": {
        "ArnNotEquals": {
         "aws:PrincipalArn": {
          "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BffRolePath}"
         }
        }
       }
      }
     ]
    }
   }
  },
  "ClientCertificate": {
   "Type": "AWS::ApiGateway::ClientCertificate",
   "Properties": {
    "Description": {
     "Fn::Sub": "${AWS::StackName} dev gateway stage certificate"
    }
   }
  },
  "InternalPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Fn::GetAtt": [
      "PrivateApi",
      "RootResourceId"
     ]
    },
    "PathPart": "internal"
   }
  },
  "BrowserIdentityPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Ref": "InternalPath"
    },
    "PathPart": "browser-identity"
   }
  },
  "VersionPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Ref": "BrowserIdentityPath"
    },
    "PathPart": "v1"
   }
  },
  "FlowsPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Ref": "VersionPath"
    },
    "PathPart": "flows"
   }
  },
  "SessionsPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Ref": "VersionPath"
    },
    "PathPart": "sessions"
   }
  },
  "CreateFlowPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Ref": "FlowsPath"
    },
    "PathPart": "create"
   }
  },
  "CreateFlowPost": {
   "Type": "AWS::ApiGateway::Method",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ResourceId": {
     "Ref": "CreateFlowPath"
    },
    "ApiKeyRequired": false,
    "AuthorizationType": "AWS_IAM",
    "HttpMethod": "POST",
    "Integration": {
     "Type": "HTTP_PROXY",
     "IntegrationHttpMethod": "POST",
     "ConnectionType": "VPC_LINK",
     "ConnectionId": {
      "Ref": "VpcLinkV2Id"
     },
     "IntegrationTarget": {
      "Fn::Sub": "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/net/${NetworkLoadBalancerNameAndId}"
     },
     "Uri": {
      "Fn::Sub": "https://${BackendServerName}:443/dev/internal/browser-identity/v1/flows/create"
     }
    }
   }
  },
  "ConsumeFlowPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Ref": "FlowsPath"
    },
    "PathPart": "consume"
   }
  },
  "ConsumeFlowPost": {
   "Type": "AWS::ApiGateway::Method",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ResourceId": {
     "Ref": "ConsumeFlowPath"
    },
    "ApiKeyRequired": false,
    "AuthorizationType": "AWS_IAM",
    "HttpMethod": "POST",
    "Integration": {
     "Type": "HTTP_PROXY",
     "IntegrationHttpMethod": "POST",
     "ConnectionType": "VPC_LINK",
     "ConnectionId": {
      "Ref": "VpcLinkV2Id"
     },
     "IntegrationTarget": {
      "Fn::Sub": "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/net/${NetworkLoadBalancerNameAndId}"
     },
     "Uri": {
      "Fn::Sub": "https://${BackendServerName}:443/dev/internal/browser-identity/v1/flows/consume"
     }
    }
   }
  },
  "AdmitSessionPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Ref": "SessionsPath"
    },
    "PathPart": "admit"
   }
  },
  "AdmitSessionPost": {
   "Type": "AWS::ApiGateway::Method",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ResourceId": {
     "Ref": "AdmitSessionPath"
    },
    "ApiKeyRequired": false,
    "AuthorizationType": "AWS_IAM",
    "HttpMethod": "POST",
    "Integration": {
     "Type": "HTTP_PROXY",
     "IntegrationHttpMethod": "POST",
     "ConnectionType": "VPC_LINK",
     "ConnectionId": {
      "Ref": "VpcLinkV2Id"
     },
     "IntegrationTarget": {
      "Fn::Sub": "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/net/${NetworkLoadBalancerNameAndId}"
     },
     "Uri": {
      "Fn::Sub": "https://${BackendServerName}:443/dev/internal/browser-identity/v1/sessions/admit"
     }
    }
   }
  },
  "CurrentSessionPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Ref": "SessionsPath"
    },
    "PathPart": "current"
   }
  },
  "CurrentSessionPost": {
   "Type": "AWS::ApiGateway::Method",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ResourceId": {
     "Ref": "CurrentSessionPath"
    },
    "ApiKeyRequired": false,
    "AuthorizationType": "AWS_IAM",
    "HttpMethod": "POST",
    "Integration": {
     "Type": "HTTP_PROXY",
     "IntegrationHttpMethod": "POST",
     "ConnectionType": "VPC_LINK",
     "ConnectionId": {
      "Ref": "VpcLinkV2Id"
     },
     "IntegrationTarget": {
      "Fn::Sub": "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/net/${NetworkLoadBalancerNameAndId}"
     },
     "Uri": {
      "Fn::Sub": "https://${BackendServerName}:443/dev/internal/browser-identity/v1/sessions/current"
     }
    }
   }
  },
  "EndSessionPath": {
   "Type": "AWS::ApiGateway::Resource",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ParentId": {
     "Ref": "SessionsPath"
    },
    "PathPart": "end"
   }
  },
  "EndSessionPost": {
   "Type": "AWS::ApiGateway::Method",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "ResourceId": {
     "Ref": "EndSessionPath"
    },
    "ApiKeyRequired": false,
    "AuthorizationType": "AWS_IAM",
    "HttpMethod": "POST",
    "Integration": {
     "Type": "HTTP_PROXY",
     "IntegrationHttpMethod": "POST",
     "ConnectionType": "VPC_LINK",
     "ConnectionId": {
      "Ref": "VpcLinkV2Id"
     },
     "IntegrationTarget": {
      "Fn::Sub": "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/net/${NetworkLoadBalancerNameAndId}"
     },
     "Uri": {
      "Fn::Sub": "https://${BackendServerName}:443/dev/internal/browser-identity/v1/sessions/end"
     }
    }
   }
  },
  "PrivateDeployment": {
   "Type": "AWS::ApiGateway::Deployment",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    }
   },
   "DependsOn": [
    "CreateFlowPost",
    "ConsumeFlowPost",
    "AdmitSessionPost",
    "CurrentSessionPost",
    "EndSessionPost"
   ]
  },
  "DevStage": {
   "Type": "AWS::ApiGateway::Stage",
   "Properties": {
    "RestApiId": {
     "Ref": "PrivateApi"
    },
    "DeploymentId": {
     "Ref": "PrivateDeployment"
    },
    "ClientCertificateId": {
     "Ref": "ClientCertificate"
    },
    "StageName": "dev",
    "CacheClusterEnabled": false,
    "TracingEnabled": false,
    "MethodSettings": [
     {
      "ResourcePath": "/*",
      "HttpMethod": "*",
      "CachingEnabled": false,
      "DataTraceEnabled": false,
      "LoggingLevel": "OFF",
      "MetricsEnabled": false
     }
    ]
   }
  }
 },
 "Outputs": {
  "PrivateApiId": {
   "Value": {
    "Ref": "PrivateApi"
   }
  },
  "DeploymentId": {
   "Value": {
    "Ref": "PrivateDeployment"
   }
  },
  "DevStageClientCertificateId": {
   "Value": {
    "Fn::GetAtt": [
     "ClientCertificate",
     "ClientCertificateId"
    ]
   }
  },
  "DevGatewayOrigin": {
   "Value": {
    "Fn::Sub": "https://${PrivateApi}-${EndpointId}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
   }
  }
 }
}
