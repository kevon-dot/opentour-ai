{
 "AWSTemplateFormatVersion": "2010-09-09",
 "Description": "OPE-213 empty isolated control topology. Application activation and provider qualification require reviewed evidence. No customer payload stores.",
 "Metadata": {
  "OpenTour": {
   "issue": "OPE-213",
   "product_acceptance": "NOT_RUN",
   "activation": "Services are absent until qualified images and separately scoped roles are provided. Application authentication remains owning code responsibility.",
   "egress": "No NAT or public IP for private services. Only database and declared AWS endpoints; external provider egress is OPE-214-owned.",
   "cost_components": [
    "alb",
    "rds",
    "nat",
    "vpc_endpoints",
    "logs",
    "audit_storage",
    "fargate",
    "sqs",
    "ecr",
    "kms",
    "secrets",
    "backup_storage",
    "data_transfer"
   ]
  }
 },
 "Parameters": {
  "Environment": {
   "Type": "String",
   "AllowedValues": [
    "dev",
    "test",
    "prod"
   ]
  },
  "ExpectedAccountId": {
   "Type": "String",
   "AllowedPattern": "[0-9]{12}"
  },
  "CertificateArn": {
   "Type": "String",
   "AllowedPattern": "arn:[a-z-]+:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+"
  },
  "EcrS3PrefixListId": {
   "Type": "String",
   "AllowedPattern": "pl-[a-f0-9]+"
  },
  "VpcCidr": {
   "Type": "String",
   "Default": "10.44.0.0/16",
   "AllowedPattern": "[0-9./]+"
  },
  "DatabaseInstanceClass": {
   "Type": "String",
   "AllowedPattern": "db\\.[a-z0-9.]+"
  },
  "DatabaseEngineVersion": {
   "Type": "String",
   "AllowedPattern": "[0-9]+\\.[0-9]+"
  },
  "DatabaseEngineFamily": {
   "Type": "String",
   "AllowedPattern": "postgres[0-9]+"
  },
  "DatabaseStorageGiB": {
   "Type": "Number",
   "MinValue": 20,
   "MaxValue": 65536
  },
  "DatabaseMaxConnections": {
   "Type": "Number",
   "MinValue": 40,
   "MaxValue": 10000
  },
  "ApplicationEnabled": {
   "Type": "String",
   "Default": "false",
   "AllowedValues": [
    "false",
    "true"
   ]
  },
  "ApiMaxInstances": {
   "Type": "Number",
   "Default": 1,
   "MinValue": 1,
   "MaxValue": 100
  },
  "ApiPoolPerInstance": {
   "Type": "Number",
   "Default": 20,
   "MinValue": 1,
   "MaxValue": 1000
  },
  "MigrationConnectionReserve": {
   "Type": "Number",
   "Default": 5,
   "MinValue": 1,
   "MaxValue": 1000
  },
  "RecoveryConnectionReserve": {
   "Type": "Number",
   "Default": 5,
   "MinValue": 1,
   "MaxValue": 1000
  },
  "OtherConnectionBudget": {
   "Type": "Number",
   "Default": 10,
   "MinValue": 0,
   "MaxValue": 1000
  },
  "BffImageDigest": {
   "Type": "String",
   "Default": "",
   "AllowedPattern": "^$|[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com(?:\\.cn)?/[a-z0-9/_-]+@sha256:[a-f0-9]{64}"
  },
  "BffTaskRoleArn": {
   "Type": "String",
   "Default": "",
   "AllowedPattern": "^$|arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+"
  },
  "ApiImageDigest": {
   "Type": "String",
   "Default": "",
   "AllowedPattern": "^$|[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com(?:\\.cn)?/[a-z0-9/_-]+@sha256:[a-f0-9]{64}"
  },
  "ApiTaskRoleArn": {
   "Type": "String",
   "Default": "",
   "AllowedPattern": "^$|arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+"
  },
  "WorkerImageDigest": {
   "Type": "String",
   "Default": "",
   "AllowedPattern": "^$|[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com(?:\\.cn)?/[a-z0-9/_-]+@sha256:[a-f0-9]{64}"
  },
  "WorkerTaskRoleArn": {
   "Type": "String",
   "Default": "",
   "AllowedPattern": "^$|arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+"
  },
  "TaskExecutionRoleArn": {
   "Type": "String",
   "Default": "",
   "AllowedPattern": "^$|arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+"
  }
 },
 "Conditions": {
  "IsProduction": {
   "Fn::Equals": [
    {
     "Ref": "Environment"
    },
    "prod"
   ]
  },
  "RunApplication": {
   "Fn::Equals": [
    {
     "Ref": "ApplicationEnabled"
    },
    "true"
   ]
  }
 },
 "Rules": {
  "CorrectAccount": {
   "Assertions": [
    {
     "Assert": {
      "Fn::Equals": [
       {
        "Ref": "ExpectedAccountId"
       },
       {
        "Ref": "AWS::AccountId"
       }
      ]
     },
     "AssertDescription": "Use the explicitly approved target account."
    }
   ]
  },
  "QualifiedServiceInputs": {
   "RuleCondition": {
    "Fn::Equals": [
     {
      "Ref": "ApplicationEnabled"
     },
     "true"
    ]
   },
   "Assertions": [
    {
     "Assert": {
      "Fn::Not": [
       {
        "Fn::Equals": [
         {
          "Ref": "BffImageDigest"
         },
         ""
        ]
       }
      ]
     },
     "AssertDescription": "Application activation requires qualified immutable image and role inputs."
    },
    {
     "Assert": {
      "Fn::Not": [
       {
        "Fn::Equals": [
         {
          "Ref": "ApiImageDigest"
         },
         ""
        ]
       }
      ]
     },
     "AssertDescription": "Application activation requires qualified immutable image and role inputs."
    },
    {
     "Assert": {
      "Fn::Not": [
       {
        "Fn::Equals": [
         {
          "Ref": "WorkerImageDigest"
         },
         ""
        ]
       }
      ]
     },
     "AssertDescription": "Application activation requires qualified immutable image and role inputs."
    },
    {
     "Assert": {
      "Fn::Not": [
       {
        "Fn::Equals": [
         {
          "Ref": "BffTaskRoleArn"
         },
         ""
        ]
       }
      ]
     },
     "AssertDescription": "Application activation requires qualified immutable image and role inputs."
    },
    {
     "Assert": {
      "Fn::Not": [
       {
        "Fn::Equals": [
         {
          "Ref": "ApiTaskRoleArn"
         },
         ""
        ]
       }
      ]
     },
     "AssertDescription": "Application activation requires qualified immutable image and role inputs."
    },
    {
     "Assert": {
      "Fn::Not": [
       {
        "Fn::Equals": [
         {
          "Ref": "WorkerTaskRoleArn"
         },
         ""
        ]
       }
      ]
     },
     "AssertDescription": "Application activation requires qualified immutable image and role inputs."
    },
    {
     "Assert": {
      "Fn::Not": [
       {
        "Fn::Equals": [
         {
          "Ref": "TaskExecutionRoleArn"
         },
         ""
        ]
       }
      ]
     },
     "AssertDescription": "Application activation requires qualified immutable image and role inputs."
    }
   ]
  }
 },
