  "DataKey": {
   "Type": "AWS::KMS::Key",
   "DeletionPolicy": "Retain",
   "UpdateReplacePolicy": "Retain",
   "Properties": {
    "Description": "Control environment metadata encryption; independent audit key is owned by OPE-217.",
    "EnableKeyRotation": true,
    "KeyPolicy": {
     "Version": "2012-10-17",
     "Statement": [
      {
       "Effect": "Allow",
       "Action": [
        "kms:*"
       ],
       "Resource": "*",
       "Principal": {
        "AWS": {
         "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
        }
       }
      }
     ]
    },
    "Tags": [
     {
      "Key": "opentour:environment",
      "Value": {
       "Ref": "Environment"
      }
     }
    ]
   }
  },
  "ApplicationSecret": {
   "Type": "AWS::SecretsManager::Secret",
   "DeletionPolicy": "Retain",
   "UpdateReplacePolicy": "Retain",
   "Properties": {
    "Description": "Unconfigured environment bootstrap secret; no provider credentials or customer payload.",
    "KmsKeyId": {
     "Fn::GetAtt": [
      "DataKey",
      "Arn"
     ]
    },
    "GenerateSecretString": {
     "SecretStringTemplate": "{\"state\":\"unconfigured\"}",
     "GenerateStringKey": "bootstrap_nonce",
     "PasswordLength": 64,
     "ExcludePunctuation": true
    },
    "Tags": [
     {
      "Key": "opentour:environment",
      "Value": {
       "Ref": "Environment"
      }
     }
    ]
   }
  },
