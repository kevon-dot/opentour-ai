    },
    "DeployRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Federated": {
                  "Ref": "OidcProviderArn"
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": {
                    "Fn::Sub": "repo:kevon-dot/opentour-ai:environment:${Environment}"
                  },
                  "token.actions.githubusercontent.com:repository_id": "1455972360",
                  "token.actions.githubusercontent.com:job_workflow_ref": {
                    "Ref": "ApprovedDeployWorkflow"
                  },
                  "token.actions.githubusercontent.com:ref": "refs/heads/main",
                  "token.actions.githubusercontent.com:environment": {
                    "Ref": "Environment"
                  }
                },
                "NumericLessThanEquals": {
                  "sts:DurationSeconds": 900
                }
              }
            }
          ]
        },
        "MaxSessionDuration": 3600,
        "Policies": [
          {
            "PolicyName": "ScopedDeploy",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
