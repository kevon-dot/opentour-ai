    "MigrationTaskBoundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "Description": "MigrationTask maximum environment permissions",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "rds-db:connect"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser/${DatabaseResourceId}/opentour_migrator"
              }
            }
          ]
        }
      }
    },
    "MigrationTaskRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
