    },
    "TaskExecutionBoundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "Description": "TaskExecution maximum environment permissions",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "ecr:GetAuthorizationToken"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "ecr:BatchGetImage",
                "ecr:GetDownloadUrlForLayer",
                "ecr:BatchCheckLayerAvailability"
              ],
              "Resource": {
                "Ref": "RepositoryArns"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": [
                {
                  "Fn::Sub": "${BffLogGroupArn}:log-stream:*"
                },
                {
                  "Fn::Sub": "${ApiLogGroupArn}:log-stream:*"
                },
                {
                  "Fn::Sub": "${WorkerLogGroupArn}:log-stream:*"
                }
              ]
            }
          ]
        }
      }
    },
