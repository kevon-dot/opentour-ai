                    {
                      "Fn::GetAtt": [
                        "BffRole",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "ApiRole",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "WorkerRole",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::GetAtt": [
                        "TaskExecutionRole",
                        "Arn"
                      ]
                    }
                  ],
                  "Condition": {
                    "StringEquals": {
                      "iam:PassedToService": "ecs-tasks.amazonaws.com"
                    }
                  }
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "opentour:environment",
            "Value": {
              "Ref": "Environment"
            }
          }
        ]
      }
    },
    "MigrationRole": {
