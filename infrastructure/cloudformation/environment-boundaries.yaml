{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "OPE-213 environment IAM boundaries. No journal administration or application grant issuance.",
  "Metadata": {
    "OpenTour": {
      "issue": "OPE-213",
      "product_acceptance": "NOT_RUN",
      "sequence": "Create empty control stack, validate output inventory, create role boundaries. OPE-217 owns independent audit stores and roles.",
      "unscoped_action_exception": "ecr:GetAuthorizationToken requires Resource *. Image reads remain repository-scoped."
    }
  },
  "Parameters": {
    "Environment": {
      "Type": "String",
      "AllowedValues": [
        "dev",
        "test",
        "prod"
      ]
    },
    "ExpectedAccountId": {
      "Type": "String",
      "AllowedPattern": "[0-9]{12}"
    },
    "DatabaseResourceId": {
      "Type": "String",
      "AllowedPattern": "db-[A-Z0-9]+"
    },
    "ApplicationSecretArn": {
      "Type": "String",
      "AllowedPattern": "arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+"
    },
    "DataKeyArn": {
      "Type": "String",
      "AllowedPattern": "arn:[a-z-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+"
    },
    "WakeupQueueArn": {
      "Type": "String",
      "AllowedPattern": "arn:[a-z-]+:sqs:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+"
    },
    "RepositoryArns": {
      "Type": "CommaDelimitedList"
    },
    "DeclaredServiceArns": {
      "Type": "CommaDelimitedList"
    },
    "BffLogGroupArn": {
      "Type": "String",
      "AllowedPattern": "arn:[a-z-]+:logs:[a-z0-9-]+:[0-9]{12}:log-group:[A-Za-z0-9_./-]+"
    },
    "ApiLogGroupArn": {
      "Type": "String",
      "AllowedPattern": "arn:[a-z-]+:logs:[a-z0-9-]+:[0-9]{12}:log-group:[A-Za-z0-9_./-]+"
    },
    "WorkerLogGroupArn": {
      "Type": "String",
      "AllowedPattern": "arn:[a-z-]+:logs:[a-z0-9-]+:[0-9]{12}:log-group:[A-Za-z0-9_./-]+"
    },
    "OidcProviderArn": {
      "Type": "String",
      "AllowedPattern": "arn:[a-z-]+:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com"
    },
    "ApprovedDeployWorkflow": {
      "Type": "String",
      "AllowedPattern": "kevon-dot/opentour-ai/\\.github/workflows/[a-zA-Z0-9_-]+\\.ya?ml@[a-f0-9]{40}"
    },
    "ApprovedMigrationWorkflow": {
      "Type": "String",
      "AllowedPattern": "kevon-dot/opentour-ai/\\.github/workflows/[a-zA-Z0-9_-]+\\.ya?ml@[a-f0-9]{40}"
    }
  },
  "Rules": {
    "CorrectAccount": {
      "Assertions": [
        {
          "Assert": {
            "Fn::Equals": [
              {
                "Ref": "ExpectedAccountId"
              },
              {
                "Ref": "AWS::AccountId"
              }
            ]
          },
          "AssertDescription": "Use the explicitly approved target account."
        }
      ]
    }
  },
  "Resources": {
    "BffBoundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "Description": "Bff maximum environment permissions",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "secretsmanager:GetSecretValue"
              ],
              "Resource": {
                "Ref": "ApplicationSecretArn"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "kms:Decrypt"
              ],
              "Resource": {
                "Ref": "DataKeyArn"
              },
              "Condition": {
                "StringEquals": {
                  "kms:ViaService": {
                    "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                  },
                  "kms:EncryptionContext:SecretARN": {
                    "Ref": "ApplicationSecretArn"
                  }
                }
              }
            }
          ]
        }
      }
    },
    "BffRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole",
              "Condition": {
                "StringEquals": {
                  "aws:SourceAccount": {
                    "Ref": "AWS::AccountId"
                  }
                },
                "ArnLike": {
                  "aws:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"
                  }
                }
              }
            }
          ]
        },
        "PermissionsBoundary": {
          "Ref": "BffBoundary"
        },
        "Policies": [
          {
            "PolicyName": "EnvironmentOnly",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "secretsmanager:GetSecretValue"
                  ],
                  "Resource": {
                    "Ref": "ApplicationSecretArn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "kms:Decrypt"
                  ],
                  "Resource": {
                    "Ref": "DataKeyArn"
                  },
                  "Condition": {
                    "StringEquals": {
                      "kms:ViaService": {
                        "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                      },
                      "kms:EncryptionContext:SecretARN": {
                        "Ref": "ApplicationSecretArn"
                      }
                    }
                  }
                }
              ]
            }
          }
        ],
        "MaxSessionDuration": 3600,
        "Tags": [
          {
            "Key": "opentour:environment",
            "Value": {
              "Ref": "Environment"
            }
          }
        ]
      }
    },
    "ApiBoundary": {
      "Type": "AWS::IAM::ManagedPolicy",
      "Properties": {
        "Description": "Api maximum environment permissions",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "secretsmanager:GetSecretValue"
              ],
              "Resource": {
                "Ref": "ApplicationSecretArn"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "kms:Decrypt"
              ],
              "Resource": {
                "Ref": "DataKeyArn"
              },
              "Condition": {
                "StringEquals": {
                  "kms:ViaService": {
                    "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                  },
                  "kms:EncryptionContext:SecretARN": {
                    "Ref": "ApplicationSecretArn"
                  }
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "rds-db:connect"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser/${DatabaseResourceId}/opentour_runtime"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "sqs:SendMessage",
                "sqs:GetQueueAttributes"
              ],
              "Resource": {
                "Ref": "WakeupQueueArn"
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "kms:GenerateDataKey",
                "kms:Decrypt"
              ],
              "Resource": {
                "Ref": "DataKeyArn"
              },
              "Condition": {
                "StringEquals": {
                  "kms:ViaService": {
                    "Fn::Sub": "sqs.${AWS::Region}.${AWS::URLSuffix}"
                  }
                }
              }
            }
          ]
        }
      }
    },
    "ApiRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole",
              "Condition": {
                "StringEquals": {
                  "aws:SourceAccount": {
                    "Ref": "AWS::AccountId"
                  }
                },
                "ArnLike": {
                  "aws:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"
                  }
                }
              }
            }
          ]
        },
        "PermissionsBoundary": {
          "Ref": "ApiBoundary"
        },
        "Policies": [
          {
            "PolicyName": "EnvironmentOnly",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "secretsmanager:GetSecretValue"
                  ],
                  "Resource": {
                    "Ref": "ApplicationSecretArn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "kms:Decrypt"
                  ],
                  "Resource": {
                    "Ref": "DataKeyArn"
                  },
                  "Condition": {
                    "StringEquals": {
                      "kms:ViaService": {
                        "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                      },
                      "kms:EncryptionContext:SecretARN": {
                        "Ref": "ApplicationSecretArn"
                      }
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "rds-db:connect"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser/${DatabaseResourceId}/opentour_runtime"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "sqs:SendMessage",
