name: Package EVE trainer on CPU
on:
  push:
    paths:
      - '.github/workflows/eve-trainer-image.yml'
      - 'training/gpu/**'
      - 'training/src/opentour_training/__init__.py'
      - 'training/src/opentour_training/training/__init__.py'
      - 'training/src/opentour_training/training/eve_sft.py'
      - 'training/src/opentour_training/training/eve_run.py'
      - 'training/profiles/*eve*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Build the reviewed application on its locked Linux runtime
        run: |
          set -euo pipefail
          # This disposable hosted runner needs space for both the CUDA layers and their export.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker buildx bake -f training/gpu/eve-bake.hcl --load eve
      - name: Exercise the offline image and checkpoint a generated model on CPU
        run: |
          set -euo pipefail
          image=$(docker image inspect --format '{{.Id}}' opentour/eve-trainer:local)
          out="$RUNNER_TEMP/eve-image"
          mkdir -p "$out"
          sudo install -d -m 0700 -o 10001 -g 10001 "$out/cpu"
          isolated=(--rm --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=1g)
          docker run "${isolated[@]}" "$image" --help
          for op in fit status pause resume stop replay; do docker run "${isolated[@]}" "$image" "$op" --help; done
          docker run "${isolated[@]}" --mount "type=bind,src=$PWD/training/profiles,dst=/qualification,readonly" --mount "type=bind,src=$out/cpu,dst=/output" --entrypoint /opt/venv/bin/python "$image" -I -B -c 'import runpy,sys;sys.path.insert(0,"/qualification");sys.argv=["qualify", "--receipt", "/output/receipt.json"];runpy.run_path("/qualification/qualify_eve_resume_cpu.py",run_name="__main__")'
          sudo chown -R "$(id -u):$(id -g)" "$out/cpu"
          printf '%s\n' "$image" > "$out/image-id.txt"
          printf '%s\n' "$GITHUB_SHA" > "$out/source-commit.txt"
          docker save opentour/eve-trainer:local | gzip -1 > "$out/eve-trainer.tar.gz"
          cd "$out"
          sha256sum eve-trainer.tar.gz image-id.txt source-commit.txt cpu/receipt.json > SHA256SUMS
      - name: Save the loadable image and verification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eve-trainer-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/eve-image
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
