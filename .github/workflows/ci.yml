{
  "name": "OpenTour verified CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "opentour-ci-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "lint": {
      "name": "lint",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "name": "Check out exact source",
          "uses": "actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Install verified pinned prerequisites",
          "run": "python3 tools/ci/prepare.py"
        },
        {
          "name": "Run actual check and screen outputs",
          "run": "python -m tools.ci.run lint",
          "id": "verify"
        },
        {
          "name": "Upload screened evidence only",
          "if": "${{ always() && steps.verify.outputs.publish_ready == 'true' }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "lint-${{ github.sha }}",
            "path": "evidence/ci/publish",
            "if-no-files-found": "error",
            "retention-days": 7,
            "include-hidden-files": false
          }
        }
      ]
    },
