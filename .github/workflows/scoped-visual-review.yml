{
  "name": "Hosted synthetic visual review",
  "on": {
    "push": {
      "branches": [
        "codex/visual-qa-effort-disclosure"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "captures": {
      "name": "Review ${{ matrix.issue }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "issue": [
            "OPE-327",
            "OPE-329"
          ]
        }
      },
      "runs-on": "macos-26",
      "timeout-minutes": 20,
      "env": {
        "QA_PRODUCT": "9aa32f646e1dbcd0f8c320e9daeb274bfde733d5",
        "QA_ISSUE": "${{ matrix.issue }}",
        "QA_START": "0",
        "QA_STOP": "192",
        "QA_INVENTORY": "{\"OPE-327\":[\"effort-ledger-reference-320-100.png\",\"effort-ledger-history-320-100.png\",\"effort-ledger-revoked-320-100.png\",\"effort-ledger-reference-320-200.png\",\"effort-ledger-history-320-200.png\",\"effort-ledger-revoked-320-200.png\",\"effort-ledger-reference-768-100.png\",\"effort-ledger-history-768-100.png\",\"effort-ledger-revoked-768-100.png\",\"effort-ledger-reference-768-200.png\",\"effort-ledger-history-768-200.png\",\"effort-ledger-revoked-768-200.png\",\"effort-ledger-reference-1280-100.png\",\"effort-ledger-history-1280-100.png\",\"effort-ledger-revoked-1280-100.png\",\"effort-ledger-reference-1280-200.png\",\"effort-ledger-history-1280-200.png\",\"effort-ledger-revoked-1280-200.png\",\"effort-ledger-reference-1440-100.png\",\"effort-ledger-history-1440-100.png\",\"effort-ledger-revoked-1440-100.png\",\"effort-ledger-reference-1440-200.png\",\"effort-ledger-history-1440-200.png\",\"effort-ledger-revoked-1440-200.png\"],\"OPE-329\":[\"disclosure-known-320-100.png\",\"disclosure-known-focus-320-100.png\",\"disclosure-undisclosed-320-100.png\",\"disclosure-after-switch-320-100.png\",\"disclosure-known-320-200.png\",\"disclosure-known-focus-320-200.png\",\"disclosure-undisclosed-320-200.png\",\"disclosure-after-switch-320-200.png\",\"disclosure-known-768-100.png\",\"disclosure-known-focus-768-100.png\",\"disclosure-undisclosed-768-100.png\",\"disclosure-after-switch-768-100.png\",\"disclosure-known-768-200.png\",\"disclosure-known-focus-768-200.png\",\"disclosure-undisclosed-768-200.png\",\"disclosure-after-switch-768-200.png\",\"disclosure-known-1280-100.png\",\"disclosure-known-focus-1280-100.png\",\"disclosure-undisclosed-1280-100.png\",\"disclosure-after-switch-1280-100.png\",\"disclosure-known-1280-200.png\",\"disclosure-known-focus-1280-200.png\",\"disclosure-undisclosed-1280-200.png\",\"disclosure-after-switch-1280-200.png\",\"disclosure-known-1440-100.png\",\"disclosure-known-focus-1440-100.png\",\"disclosure-undisclosed-1440-100.png\",\"disclosure-after-switch-1440-100.png\",\"disclosure-known-1440-200.png\",\"disclosure-known-focus-1440-200.png\",\"disclosure-undisclosed-1440-200.png\",\"disclosure-after-switch-1440-200.png\"]}"
      },
      "steps": [
        {
          "name": "Check out pinned product revision",
          "uses": "actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8",
          "with": {
            "ref": "9aa32f646e1dbcd0f8c320e9daeb274bfde733d5",
            "persist-credentials": false
          }
        },
        {
          "name": "Install pinned prerequisites",
          "run": "python3 tools/ci/prepare.py"
        },
        {
          "name": "Prepare verified browser harness",
          "shell": "bash",
          "run": "set -euo pipefail\njust setup\nPLAYWRIGHT_BROWSERS_PATH=\"$PWD/.toolchain/playwright\" pnpm exec playwright install --only-shell chromium"
        },
        {
          "name": "Qualify registered suite and return named synthetic PNGs",
          "shell": "bash",
          "run": "python - <<'PY_REVIEW'\nimport base64\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport struct\nimport subprocess\nimport sys\nfrom tools.ci.browser_evidence import PRESENTATION_TARGETS, local_file\nfrom tools.ci.run import run_browser, safe_environment\n\nroot = Path.cwd().resolve()\nissue = os.environ[\"QA_ISSUE\"]\nexpected = set(json.loads(os.environ[\"QA_INVENTORY\"])[issue])\nproduct = os.environ[\"QA_PRODUCT\"]\ntargets = [name for name, owner in PRESENTATION_TARGETS.items() if owner == issue]\nif len(targets) != 1:\n    sys.exit(\"QA: expected exactly one registered product suite for \" + issue)\nif subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], text=True).strip() != product:\n    sys.exit(\"QA: product revision mismatch\")\nenv = safe_environment()\nenv[\"PLAYWRIGHT_BROWSERS_PATH\"] = str(root / \".toolchain/playwright\")\nresult = run_browser(root, env, targets[0])\nif result[\"status\"] != \"PASS\":\n    command = result.get(\"command_evidence\", {})\n    tests = (command.get(\"steps\") or [{}])[0].get(\"tests\", {})\n    reason = tests.get(\"reason_code\", \"COMMAND_OR_MANIFEST_VERIFICATION_FAILED\")\n    if not isinstance(reason, str) or not reason.replace(\"_\", \"\").isalnum():\n        reason = \"COMMAND_OR_MANIFEST_VERIFICATION_FAILED\"\n    sys.exit(f\"QA: registered browser suite failed ({issue}, {reason[:70]})\")\nverified = result[\"browser_artifacts\"]\nmanifest = verified[\"manifest\"]\nif (manifest[\"commit_sha\"] != product or manifest[\"issue_key\"] != issue\n        or manifest[\"kind\"] != \"simulated\" or manifest[\"git_worktree_dirty\"] is not False\n        or manifest[\"fixture_id\"] != \"scoped-presentation-v1\"):\n    sys.exit(\"QA: product fixture identity mismatch\")\nfiles = {}\nfor record in manifest[\"outputs\"]:\n    rel = record[\"path\"]\n    if not rel.endswith(\".png\") or \"/attachments/\" in rel:\n        continue\n    filename = Path(rel).name\n    if filename not in expected or filename in files:\n        sys.exit(\"QA: unexpected synthetic capture inventory\")\n    files[filename] = record\nif set(files) != expected:\n    sys.exit(\"QA: missing requested screenshots\")\nnames = sorted(files)[int(os.environ[\"QA_START\"]):int(os.environ[\"QA_STOP\"])]\nif not names:\n    sys.exit(\"QA: no screenshots in selected range\")\n# Verify the complete selected set before emitting any of its pixels.\ncaptures = []\nfor name in names:\n    record = files[name]\n    data = local_file(root, record[\"path\"]).read_bytes()\n    sha = hashlib.sha256(data).hexdigest()\n    if sha != record[\"sha256\"] or data[:8] != b\"\\x89PNG\\r\\n\\x1a\\n\" or data[12:16] != b\"IHDR\":\n        sys.exit(\"QA: invalid selected PNG\")\n    width, height = struct.unpack(\">II\", data[16:24])\n    if not (0 < width <= 4096 and 0 < height <= 32768 and len(data) <= 4*1024*1024):\n        sys.exit(\"QA: PNG outside review bounds\")\n    captures.append((name, sha, width, height, data))\nprint(f\"OTQA-BEGIN {issue} {product} {verified['manifest_sha256']} {len(captures)}\", flush=True)\nfor name, sha, width, height, data in captures:\n    size = 3072\n    parts = (len(data) + size - 1) // size\n    print(f\"OTQA-IMAGE {name} {sha} {width} {height} {len(data)} {parts}\")\n    for i in range(parts):\n        chunk = base64.b64encode(data[i*size:(i+1)*size]).decode(\"ascii\")\n        print(f\"OTQA-DATA {name} {i} {chunk}\")\nprint(f\"OTQA-END {issue} {product} {len(captures)}\", flush=True)\nPY_REVIEW"
        }
      ]
    }
  }
}
