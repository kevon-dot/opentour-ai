name: Packaged Slack journeys

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/slack-journeys.yml
      - services/cell-runtime/**
      - packages/contracts/common/python-unit/**
      - packages/authority-journal/**
      - docs/pilot-*.md
      - training/profiles/smollm2_135m_lora_v1*
      - training/src/opentour_training/training/open_weight_worker.py
      - tools/build_pilot_kit.py
      - tools/build_slack_pilot_kit.py
      - tools/ci/prepare.py
      - tools/toolchain.json
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  packaged-slack-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: python3 tools/ci/prepare.py
      - name: Build the candidate kit
        run: |
          just setup
          uv pip install --python .venv/bin/python --require-hashes --only-binary :all: -r services/cell-runtime/integrations/slack/requirements.txt -r services/cell-runtime/tests/pilot/mcp-sdk-linux-requirements.txt
          .venv/bin/python tools/build_slack_pilot_kit.py "$RUNNER_TEMP/kit.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-sha.txt"
          (cd "$RUNNER_TEMP" && sha256sum kit.zip > kit.sha256)
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/kit"
          (cd "$RUNNER_TEMP/kit" && sha256sum --check --quiet SHA256SUMS)
      - name: Check out independent customer probes from PR 87
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 32f2749d1fe1b933acd2ebaa3e9f09dbf759fede
          path: published-probes
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /services/cell-runtime/tests/pilot/test_customer_journey.py
            /services/cell-runtime/tests/pilot/test_slack_customers.py
      - name: Exercise the packaged worker with generated Slack and reader fixtures
        env:
          OPENTOUR_UNIT_GUARD: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          pilot=services/cell-runtime/tests/pilot
          export PYTHONPATH="$PWD/packages/contracts/common/python-unit:$RUNNER_TEMP/kit/opentour-slack.pyz:$PWD/$pilot"
          .venv/bin/python -c 'import os; from pathlib import Path; from opentour_cell.pilot import slack_adapter; assert Path(slack_adapter.__file__).is_relative_to(Path(os.environ["RUNNER_TEMP"]) / "kit/opentour-slack.pyz")'
          .venv/bin/python -m pytest -q -c pyproject.toml -o xfail_strict=true \
            --junitxml="$RUNNER_TEMP/journeys.xml" \
            "published-probes/$pilot/test_customer_journey.py" \
            "published-probes/$pilot/test_slack_customers.py" \
            "$pilot/test_p1_starter_journey.py" \
            "$pilot/test_p1_live_after_starter.py" \
            "$pilot/test_live_identity_supersession.py" \
            "$pilot/test_live_evidence.py::test_outcome_before_decision_is_buffered_and_wrong_verifier_quarantined" \
            "$pilot/test_live_readiness.py::test_three_independent_residuals_do_not_admit_training" \
            "$pilot/test_historical_worker.py::test_worker_fresh_process_and_restarts_produce_one_actual_baseline_without_fits" \
            "$pilot/qualified_slack_checks.py" \
            "$pilot/qualified_workflow_index_checks.py" \
            "$pilot/test_lifecycle_status_home.py::test_recipient_replay_and_restored_target_through_private_home"
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          cases = ElementTree.parse(Path(os.environ["RUNNER_TEMP"]) / "journeys.xml").findall(".//testcase")
          source_counts = {
              "test_customer_journey": 3,
              "test_slack_customers": 17,
              "test_p1_starter_journey": 2,
              "test_p1_live_after_starter": 3,
              "test_live_identity_supersession": 2,
              "test_live_evidence": 1,
              "test_live_readiness": 2,
              "test_historical_worker": 1,
              "qualified_slack_checks": 2,
              "qualified_workflow_index_checks": 1,
              "test_lifecycle_status_home": 1,
          }
          for module, minimum in source_counts.items():
              selected = [c for c in cases if c.get("classname", "").split(".")[-1] == module]
              if len(selected) < minimum or any(c.find(tag) is not None for c in selected for tag in ("skipped", "error", "failure")):
                  raise SystemExit(f"Missing or nonpassing customer journey in {module}")
          print(f"{len(cases)} generated packaged checks passed")
          PY
      - name: Exercise cold-start intake through independent official SDK sessions
        run: |
          pilot=services/cell-runtime/tests/pilot
          # The SDK owns a new process group per stdio session. The integration runner
          # isolates its processes and network while running as the unprivileged runner.
          sudo unshare --net --pid --fork --kill-child --mount-proc --setgid "$(id -g)" --setuid "$(id -u)" -- \
            env -i HOME="$HOME" PATH="$PATH" PYTHONPATH="$RUNNER_TEMP/kit/opentour-slack.pyz:$PWD/$pilot" \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1 OPENTOUR_P1_MCP_WITNESS=1 \
            .venv/bin/python -m pytest -q -c pyproject.toml -o xfail_strict=true \
            --junitxml="$RUNNER_TEMP/p1-mcp.xml" "$pilot/test_p1_live_after_starter.py"
          .venv/bin/python - "$RUNNER_TEMP/p1-mcp.xml" <<'PYTHON'
          import json
          import sys
          from xml.etree import ElementTree
          suite = ElementTree.parse(sys.argv[1]).find(".//testsuite")
          expected = {"p1_default-off", "p1_signed-observation", "p1_private-owner-recipient"}
          receipts = {p.get("name"): json.loads(p.get("value")) for p in suite.findall("properties/property")}
          if set(receipts) != expected or any(r["intake_transport"] != "mcp-sdk-stdio" for r in receipts.values()):
              raise SystemExit("Missing required SDK journey evidence")
          if suite.get("tests") != "3" or any(suite.get(k) != "0" for k in ("failures", "errors", "skipped")):
              raise SystemExit("Incomplete SDK journey run")
          PYTHON
      - name: Retain package and journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packaged-slack-journeys-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/candidate-sha.txt
            ${{ runner.temp }}/kit.sha256
            ${{ runner.temp }}/journeys.xml
            ${{ runner.temp }}/p1-mcp.xml
          retention-days: 14
